on:
  push:
    branches: [main, master]
  pull_request:

name: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@v1
    permissions:
      contents: write
    # The main ruleset requires pull requests, so the badge commit goes to
    # gh-pages, which takes bot pushes (pkgdown deploys there too).
    with:
      badge-branch: gh-pages
      badge-path: badges/coverage.svg
      # line and branch coverage of src/ through gcov, beside covr's number
      # (review #50); simdutf itself is upstream's to cover
      native: true
      native-exclude: src/vendor
