# Design §11: tools/run-benchmarks.R on 256 MB inputs, once per kernel each
# runner supports, against validUTF8(), iconv() and base64enc. Not a gate:
# nothing here fails on a slow number. The numbers go into design §11 by
# hand, from the job summaries. Run on demand, or on a pull request with the
# `benchmarks` label.
on:
  workflow_dispatch:
    inputs:
      megabytes:
        description: Input size in MB
        type: number
        default: 256
  pull_request:
    types: [labeled]

name: benchmarks

permissions: read-all

jobs:
  benchmarks:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'benchmarks'
    runs-on: ${{ matrix.os }}
    name: benchmarks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::base64enc
      - name: CPU
        run: |
          case "$RUNNER_OS" in
            Linux) grep -m1 'model name' /proc/cpuinfo ;;
            macOS) sysctl -n machdep.cpu.brand_string ;;
            Windows) powershell -Command "(Get-CimInstance Win32_Processor).Name" ;;
          esac
      - run: R CMD INSTALL --preclean .
      - name: Benchmarks
        run: Rscript tools/run-benchmarks.R ${{ inputs.megabytes || 256 }}
